databases:
  - name: khl-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: khl-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. python scripts/serve.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: khl-db
          property: connectionString

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: PUBLIC_URL
        value: https://khl-agent-api-9dw6.onrender.com

      - key: TELEGRAM_WEBHOOK_PATH
        value: /telegram/webhook

      - key: CHANNEL_USERNAME
        sync: false

      - key: ODDS_API_KEY
        sync: false
