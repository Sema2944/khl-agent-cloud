databases:
  - name: khl-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: khl-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. python scripts/serve.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: khl-db
          property: connectionString

  - type: worker
    name: khl-agent-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. python scripts/run_telegram.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: khl-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: API_BASE
        value: https://khl-agent-api-9dw6.onrender.com
      - key: BACKEND_TIMEOUT
        value: "8"
