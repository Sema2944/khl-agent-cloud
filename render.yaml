services:
  - type: web
    name: khl-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. python scripts/serve.py
    envVars:
      - key: API_BASE
        value: https://khl-agent-api.onrender.com

  - type: worker
    name: khl-agent-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. python scripts/run_telegram.py
    envVars:
      - key: API_BASE
        value: https://khl-agent-api.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
