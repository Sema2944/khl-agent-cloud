[project]
name = "confident-expert-bot"
version = "0.1.0"
description = "Telegram bot for the 'Confident Expert — Outfit' GPT interface"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "aiogram>=3.4.1",
    "aioboto3>=12.4.0",
    "aiosqlite>=0.20.0",
    "openai>=1.30.1",
    "pydantic-settings>=2.2.1",
]

[project.scripts]
confident-expert-bot = "confident_expert_bot.main:main"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]
