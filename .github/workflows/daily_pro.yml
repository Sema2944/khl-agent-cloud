name: Daily Pro Job

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 11:00 МСК
  workflow_dispatch:

jobs:
  daily-pro:
    runs-on: ubuntu-latest
    steps:
      - name: Call Daily Pro endpoint
        env:
          DAILY_PRO_URL: ${{ secrets.DAILY_PRO_URL }}
        run: |
          echo "Calling Daily Pro endpoint..."
          curl -sS -X POST "$DAILY_PRO_URL"
