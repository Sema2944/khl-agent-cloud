name: Daily Pro Job

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  daily-pro:
    runs-on: ubuntu-latest
    environment: production   # ← ВОТ ЭТО КЛЮЧЕВО
    steps:
      - name: Debug secret
        env:
          DAILY_PRO_JOB_KEY: ${{ secrets.DAILY_PRO_JOB_KEY }}
        run: |
          echo "Key length: ${#DAILY_PRO_JOB_KEY}"
          test -n "$DAILY_PRO_JOB_KEY"

      - name: Call Daily Pro
        env:
          DAILY_PRO_JOB_KEY: ${{ secrets.DAILY_PRO_JOB_KEY }}
        run: |
          curl -X POST "https://khl-agent-api-9dw6.onrender.com/jobs/daily-pro?key=$DAILY_PRO_JOB_KEY"
